apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  labels:
    app: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      containers:
        - name: dashboard
          image: hardtec-app
          imagePullPolicy: IfNotPresent
          command: ["streamlit", "run", "streamlit/app.py"]
          args: ["--server.address=0.0.0.0", "--server.port=8501"]
          ports:
            - name: http
              containerPort: 8501
          envFrom:
            - configMapRef:
                name: hardtec-config
            - secretRef:
                name: hardtec-secrets
          volumeMounts:
            - name: hardtec-data
              mountPath: /app/data
              readOnly: true
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 45
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
      volumes:
        - name: hardtec-data
          persistentVolumeClaim:
            claimName: hardtec-data
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  labels:
    app: dashboard
spec:
  selector:
    app: dashboard
  ports:
    - name: http
      port: 8501
      targetPort: http
  type: ClusterIP
