apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hardtec-headlamp-crd-view
rules:
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hardtec-headlamp-crd-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hardtec-headlamp-crd-view
subjects:
  - kind: ServiceAccount
    name: headlamp-ui
    namespace: headlamp